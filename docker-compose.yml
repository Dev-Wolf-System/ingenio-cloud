# =============================================================================
# Ingenio Cloud — Docker Compose (VPS Hostinger srv878399)
# Patrón split backend + frontend, redes externas compartidas con stack existente
#
# Pre-requisitos en VPS:
#   docker network ls | grep -E "n8n_evoapi|supabase_network"
#   (ambas tienen que existir; si no: docker network create <name>)
#
# Deploy:
#   cd /opt/ingenio-cloud
#   cp .env.example .env && nano .env   # completar secrets
#   cd infra
#   docker compose --env-file ../.env build
#   docker compose --env-file ../.env up -d
#
# Logs:
#   docker compose --env-file ../.env logs -f --tail=100 ingenio-backend
#
# Update:
#   git pull && docker compose --env-file ../.env build --pull && \
#     docker compose --env-file ../.env up -d --remove-orphans
# =============================================================================

name: ingenio-cloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ───────────────────────────────────────────────────────────────────────────
  # BACKEND NestJS API · puerto 3001 · WebSocket /ws/dashboard/*
  # ───────────────────────────────────────────────────────────────────────────
  ingenio-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ingenio-cloud/backend:latest
    container_name: ingenio-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - PORT=3001
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DB_HOST=${DB_HOST:-supabase-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DATABASE_URL=${DATABASE_URL}
      # JWT internal
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      # URLs
      - FRONTEND_URL=https://${DOMAIN_NAME}
      - BACKEND_URL=https://${DOMAIN_NAME}/api
      # Webhooks + WS auth
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - MILL_SPEED_WEBHOOK_SECRET=${MILL_SPEED_WEBHOOK_SECRET}
      # MSSQL CORONA legacy (via Tailscale en host VPS)
      - MSSQL_HOST=${MSSQL_HOST:-192.168.0.177}
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      - MSSQL_DATABASE=${MSSQL_DATABASE:-CORONA}
      - MSSQL_USER=${MSSQL_USER:-fs1}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_ENCRYPT=false
      - MSSQL_TRUST_SERVER_CERTIFICATE=true
      # HTTP molienda
      - MOLIENDA_HTTP_URL=${MOLIENDA_HTTP_URL}
      - MOLIENDA_HTTP_AUTH=${MOLIENDA_HTTP_AUTH}
      # Node-RED guardia endpoint (cron pull cada 05:15/13:15/21:15 ART)
      - NODERED_GUARDIA_URL=${NODERED_GUARDIA_URL:-https://nodered.srv878399.hstgr.cloud/api/resumen-guardia/}
      - NODERED_AUTH=${NODERED_AUTH}
      # InfluxDB 3 (mismo network n8n_evoapi, hostname container)
      - INFLUX_URL=${INFLUX_URL:-http://influxdb3:8181}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_DATABASE=${INFLUX_DATABASE:-corona2026}
      # IA APIs (Sprint 1+)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      # Web Push (VAPID) — notificaciones alertas
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Comms
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      # Reportes de turno (webhook n8n → Telegram)
      - WEBHOOK_REPORTE_TURNO_URL=${WEBHOOK_REPORTE_TURNO_URL}
      - WEBHOOK_REPORTE_TURNO_SECRET=${WEBHOOK_REPORTE_TURNO_SECRET}
      - REPORTE_TURNO_ENABLED=${REPORTE_TURNO_ENABLED:-true}
      - REPORTE_TURNO_RETRY_INTERVAL_MINUTES=${REPORTE_TURNO_RETRY_INTERVAL_MINUTES:-1}
      - REPORTE_TURNO_RETRY_MAX_HOURS=${REPORTE_TURNO_RETRY_MAX_HOURS:-4}
      # Contraseña panel de configuración de alertas (nunca exponer al frontend)
      - CONFIG_PASSWORD=${CONFIG_PASSWORD}
      # Observabilidad
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 1g
    mem_reservation: 256m
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_evoapi
      # Backend service único
      - traefik.http.services.ingenio-api.loadbalancer.server.port=3001
      # Router /api/* (REST) — priority alto para ganar a catch-all frontend
      - traefik.http.routers.ingenio-api.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)
      - traefik.http.routers.ingenio-api.priority=200
      - traefik.http.routers.ingenio-api.entrypoints=web,websecure
      - traefik.http.routers.ingenio-api.tls=true
      - traefik.http.routers.ingenio-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.ingenio-api.service=ingenio-api
      # Router /ws/* (WebSocket) — mismo service, priority alto
      - traefik.http.routers.ingenio-ws.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/ws`)
      - traefik.http.routers.ingenio-ws.priority=200
      - traefik.http.routers.ingenio-ws.entrypoints=web,websecure
      - traefik.http.routers.ingenio-ws.tls=true
      - traefik.http.routers.ingenio-ws.tls.certresolver=mytlschallenge
      - traefik.http.routers.ingenio-ws.service=ingenio-api
      # Headers seguridad
      - traefik.http.middlewares.ingenio-api-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.ingenio-api-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.ingenio-api-headers.headers.contentTypeNosniff=true
      - traefik.http.routers.ingenio-api.middlewares=ingenio-api-headers@docker
    networks:
      - n8n_evoapi
      - supabase_network

  # ───────────────────────────────────────────────────────────────────────────
  # FRONTEND Next.js 14 standalone · puerto 3000
  # ───────────────────────────────────────────────────────────────────────────
  ingenio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_NAME=Ingenio Cloud
        - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
        - NEXT_PUBLIC_DEFAULT_TENANT_SLUG=lacorona
        - NEXT_PUBLIC_DEFAULT_PLANT_SLUG=planta-sur
        - NEXT_PUBLIC_COPILOT_ENABLED=false
        - NEXT_PUBLIC_TV_AUTO_FULLSCREEN=true
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    image: ingenio-cloud/frontend:latest
    container_name: ingenio-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=4 http://localhost:3000 || curl -fsS http://localhost:3000 -o /dev/null"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 5
    mem_limit: 512m
    mem_reservation: 128m
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_evoapi
      - traefik.http.routers.ingenio-web.rule=Host(`${DOMAIN_NAME}`)
      - traefik.http.routers.ingenio-web.priority=10
      - traefik.http.routers.ingenio-web.tls=true
      - traefik.http.routers.ingenio-web.entrypoints=web,websecure
      - traefik.http.routers.ingenio-web.tls.certresolver=mytlschallenge
      - traefik.http.routers.ingenio-web.service=ingenio-web
      - traefik.http.services.ingenio-web.loadbalancer.server.port=3000
      # Headers
      - traefik.http.middlewares.ingenio-web-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.ingenio-web-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.ingenio-web-headers.headers.contentTypeNosniff=true
      - traefik.http.routers.ingenio-web.middlewares=ingenio-web-headers@docker
    networks:
      - n8n_evoapi

# ─── Redes externas (creadas por stacks existentes en VPS) ───────────────────
networks:
  n8n_evoapi:
    external: true
  supabase_network:
    external: true
